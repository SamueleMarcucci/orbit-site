<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title desc"><title id="title">Elevation is an angle above the horizon</title><desc id="desc">Illustrative diagram: a horizontal horizon is zero degrees, straight overhead is ninety degrees, and an example diagonal sight line is forty-five degrees. This is not a satellite prediction.</desc><style>text{font-family:system-ui,sans-serif;fill:#17212b;font-size:17px}.line{fill:none;stroke:#17212b;stroke-width:3}.guide{fill:none;stroke:#59636e;stroke-width:2;stroke-dasharray:5 5}</style><path class="line" d="M85 215H540M85 215V30"/><path class="line" d="M85 215L255 45"/><path class="guide" d="M165 215A80 80 0 0 0 141.57 158.43"/><circle cx="85" cy="215" r="6" fill="#17212b"/><text x="330" y="240">Horizon · 0°</text><text x="95" y="32">Overhead · 90°</text><text x="185" y="165">Example · 45°</text><text x="255" y="68">Sight line</text></svg>