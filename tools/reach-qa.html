<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Live Orbit local render checks</title>
<style>body{font:16px system-ui;margin:24px;background:#eee;color:#222}header{max-width:1100px;margin:auto}label{margin-right:20px}select,button{font:inherit;padding:8px}iframe{display:block;border:1px solid #aaa;height:900px;background:white;margin:24px auto;max-width:none}pre{white-space:pre-wrap;max-height:160px;overflow:auto}p{line-height:1.5}.frame-wrap{overflow:auto}#state{font-weight:600}</style>
<header><h1>Live Orbit · local render checks</h1><p>This test page is local only. It displays the static export at a fixed viewport and checks the rendered document.</p><label>Page <select id="route"></select></label><label>Width <select id="width"><option>375</option><option>768</option><option>1440</option></select></label><button id="check">Check every page</button><p id="state">Loading preview…</p><pre id="results"></pre></header><div class="frame-wrap"><iframe title="Live Orbit preview" id="preview" width="375"></iframe></div>
<script>
const routes=['/','/features/','/guides/','/guides/satellite-tracking-iphone/','/guides/how-to-see-iss/','/guides/visible-satellite-passes/','/guides/satellite-tracking-ipad/','/guides/identify-satellite-night-sky/','/guides/sky-mode-ar-satellite-tracking/','/guides/satellite-orbit-data-tle-norad/','/guides/satellite-radio-recordings/','/guides/time-mode-satellite-tracking/','/guides/starlink-satellite-trains/','/guides/satellite-observing-checklist/','/support/','/privacy/','/credits/','/terms/'];
const frame=document.querySelector('#preview'), route=document.querySelector('#route'), width=document.querySelector('#width'), state=document.querySelector('#state'), results=document.querySelector('#results');
for(const path of routes){const option=document.createElement('option');option.value=path;option.textContent=path;route.append(option)}
let busy=false;
async function render(path,w){frame.width=w;frame.src=path;await new Promise(resolve=>frame.onload=resolve);const doc=frame.contentDocument;await doc.fonts.ready;for(const img of doc.images)img.loading='eager';await Promise.all([...doc.images].map(img=>img.decode().catch(()=>{})));await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const result={route:path,width:w,viewport:frame.contentWindow.innerWidth,overflow:doc.documentElement.scrollWidth-frame.contentWindow.innerWidth,h1s:doc.querySelectorAll('h1').length,badImages:[...doc.images].filter(img=>!img.naturalWidth).map(img=>img.src),schema:[...doc.querySelectorAll('script[type="application/ld+json"]')].every(s=>{try{JSON.parse(s.textContent);return true}catch{return false}})};result.passed=result.overflow<=1&&result.h1s===1&&result.badImages.length===0&&result.schema;state.textContent=(result.passed?'PASS':'FAIL')+' '+path+' at '+w+'px · overflow '+result.overflow+'px · '+result.h1s+' H1 · '+result.badImages.length+' broken images';return result}
async function selected(){if(!busy){const r=await render(route.value,Number(width.value));results.textContent=JSON.stringify(r,null,2)}}route.onchange=selected;width.onchange=selected;
document.querySelector('#check').onclick=async()=>{if(busy)return;busy=true;route.disabled=width.disabled=true;const report=[];for(const w of [375,768,1440])for(const path of routes){try{report.push(await render(path,w))}catch(e){report.push({route:path,width:w,passed:false,error:String(e)})}}results.textContent=JSON.stringify({passed:report.every(r=>r.passed),checks:report.length,failures:report.filter(r=>!r.passed),results:report},null,2);route.disabled=width.disabled=false;busy=false;await render(route.value,Number(width.value));state.textContent=(report.every(r=>r.passed)?'PASS':'FAIL')+' · '+report.length+' page/width checks completed · '+report.filter(r=>!r.passed).length+' failures';document.title=state.textContent+' | Live Orbit local QA'};
route.value='/guides/';selected();
</script></html>
